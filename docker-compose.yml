services:
  postgres:
    image: postgres:16-alpine
    pull_policy: never
    container_name: website-builder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo
      POSTGRES_DB: catalogo
    ports:
      - "5433:5432"
    volumes:
      - catalogo_web_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: website-builder-app
    working_dir: /app
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://catalogo:catalogo@postgres:5432/catalogo?sslmode=disable
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3000
      CI: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/app/scripts/entrypoint.sh"]
    command: ["npm", "run", "dev"]
    stdin_open: true
    tty: true

volumes:
  catalogo_web_pgdata:
    name: catalogo_web_pgdata
  app_node_modules:
  app_next:
